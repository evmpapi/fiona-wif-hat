<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="A cartoon giraffe wearing a very long red scarf">
  <rect width="200" height="200" rx="16" fill="#ffe08a"/>
  <ellipse cx="100" cy="188" rx="50" ry="8" fill="#000" opacity=".12"/>
  <!-- neck -->
  <rect x="86" y="70" width="28" height="90" rx="10" fill="#f0b429"/>
  <circle cx="93" cy="95" r="5" fill="#d4891a"/>
  <circle cx="107" cy="118" r="5" fill="#d4891a"/>
  <circle cx="94" cy="140" r="4.5" fill="#d4891a"/>
  <!-- scarf -->
  <path d="M70 108 Q100 98 130 112 Q150 120 168 150" fill="none" stroke="#c41e3a" stroke-width="14" stroke-linecap="round"/>
  <path d="M70 108 Q100 98 130 112 Q150 120 168 150" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 8" opacity=".5"/>
  <rect x="156" y="148" width="18" height="28" fill="#c41e3a"/>
  <rect x="156" y="172" width="6" height="14" fill="#c41e3a"/>
  <rect x="164" y="172" width="6" height="10" fill="#c41e3a"/>
  <!-- head -->
  <ellipse cx="100" cy="58" rx="32" ry="28" fill="#f0b429"/>
  <ellipse cx="100" cy="70" rx="16" ry="10" fill="#f7d48a"/>
  <!-- ossicones -->
  <rect x="80" y="22" width="6" height="22" fill="#f0b429"/>
  <circle cx="83" cy="20" r="7" fill="#c4722a"/>
  <rect x="114" y="22" width="6" height="22" fill="#f0b429"/>
  <circle cx="117" cy="20" r="7" fill="#c4722a"/>
  <!-- ears -->
  <ellipse cx="68" cy="52" rx="10" ry="14" fill="#f0b429"/>
  <ellipse cx="132" cy="52" rx="10" ry="14" fill="#f0b429"/>
  <!-- eyes -->
  <circle cx="90" cy="58" r="5" fill="#221"/>
  <circle cx="110" cy="58" r="5" fill="#221"/>
  <circle cx="91.5" cy="56.5" r="1.6" fill="#fff"/>
  <circle cx="111.5" cy="56.5" r="1.6" fill="#fff"/>
  <!-- smile -->
  <path d="M92 74 Q100 80 108 74" fill="none" stroke="#8a4b12" stroke-width="2" stroke-linecap="round"/>
  <!-- body hint -->
  <ellipse cx="100" cy="170" rx="34" ry="18" fill="#f0b429"/>
</svg>
