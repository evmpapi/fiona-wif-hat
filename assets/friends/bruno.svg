<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="A cartoon gorilla wearing a backwards baseball cap">
  <rect width="200" height="200" rx="16" fill="#d7c4a8"/>
  <ellipse cx="100" cy="188" rx="55" ry="8" fill="#000" opacity=".12"/>
  <!-- body -->
  <ellipse cx="100" cy="152" rx="58" ry="38" fill="#3e2c22"/>
  <ellipse cx="100" cy="162" rx="30" ry="20" fill="#c4a07a"/>
  <!-- arms -->
  <ellipse cx="36" cy="154" rx="20" ry="30" fill="#3e2c22"/>
  <ellipse cx="164" cy="154" rx="20" ry="30" fill="#3e2c22"/>
  <ellipse cx="30" cy="178" rx="14" ry="10" fill="#3e2c22"/>
  <ellipse cx="170" cy="178" rx="14" ry="10" fill="#3e2c22"/>
  <!-- head -->
  <ellipse cx="100" cy="88" rx="54" ry="50" fill="#3e2c22"/>
  <!-- ears -->
  <circle cx="46" cy="90" r="16" fill="#3e2c22"/>
  <circle cx="154" cy="90" r="16" fill="#3e2c22"/>
  <circle cx="46" cy="90" r="8" fill="#c4a07a"/>
  <circle cx="154" cy="90" r="8" fill="#c4a07a"/>
  <!-- face mask -->
  <ellipse cx="100" cy="104" rx="38" ry="30" fill="#c4a07a"/>
  <ellipse cx="100" cy="96" rx="28" ry="16" fill="#d8b896"/>
  <!-- eyes -->
  <circle cx="84" cy="92" r="6.5" fill="#1a100c"/>
  <circle cx="116" cy="92" r="6.5" fill="#1a100c"/>
  <circle cx="86" cy="90.5" r="1.8" fill="#fff"/>
  <circle cx="118" cy="90.5" r="1.8" fill="#fff"/>
  <!-- brow -->
  <path d="M72 82 Q100 74 128 82" fill="none" stroke="#2a1c16" stroke-width="4" stroke-linecap="round"/>
  <!-- nose -->
  <ellipse cx="100" cy="110" rx="16" ry="10" fill="#3e2c22"/>
  <ellipse cx="94" cy="110" rx="3.2" ry="2.6" fill="#1a100c"/>
  <ellipse cx="106" cy="110" rx="3.2" ry="2.6" fill="#1a100c"/>
  <!-- smile -->
  <path d="M86 124 Q100 134 114 124" fill="none" stroke="#2a1c16" stroke-width="3" stroke-linecap="round"/>
  <!-- backwards cap: crown sits on head, long bill sticks out the BACK (right) -->
  <ellipse cx="92" cy="50" rx="46" ry="18" fill="#1e4d8c"/>
  <path d="M48 52 Q92 28 132 48 L128 62 Q92 44 52 64 Z" fill="#2563b8"/>
  <rect x="82" y="46" width="16" height="10" rx="2" fill="#f4d35e"/>
  <!-- bill pointing backward -->
  <ellipse cx="150" cy="58" rx="28" ry="10" fill="#1e4d8c"/>
  <ellipse cx="150" cy="56" rx="22" ry="5" fill="#2d6fbf"/>
</svg>
