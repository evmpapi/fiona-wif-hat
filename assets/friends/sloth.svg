<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="A cartoon sloth wearing a Walkman and headphones">
  <rect width="200" height="200" rx="16" fill="#c8e6c0"/>
  <ellipse cx="100" cy="188" rx="50" ry="8" fill="#000" opacity=".12"/>
  <!-- body -->
  <ellipse cx="100" cy="128" rx="50" ry="46" fill="#c48a4a"/>
  <ellipse cx="100" cy="136" rx="32" ry="28" fill="#e8c896"/>
  <!-- arms -->
  <ellipse cx="48" cy="130" rx="18" ry="10" fill="#c48a4a"/>
  <ellipse cx="152" cy="130" rx="18" ry="10" fill="#c48a4a"/>
  <!-- walkman -->
  <rect x="80" y="132" width="40" height="24" rx="3" fill="#3a3a3a" stroke="#222" stroke-width="2"/>
  <rect x="84" y="136" width="18" height="10" rx="1" fill="#9ad"/>
  <circle cx="112" cy="144" r="5" fill="#ddd"/>
  <circle cx="112" cy="144" r="2" fill="#888"/>
  <!-- head -->
  <circle cx="100" cy="70" r="40" fill="#c48a4a"/>
  <ellipse cx="100" cy="78" rx="26" ry="22" fill="#e8c896"/>
  <!-- eye patches -->
  <ellipse cx="84" cy="68" rx="12" ry="10" fill="#8a5a2a"/>
  <ellipse cx="116" cy="68" rx="12" ry="10" fill="#8a5a2a"/>
  <circle cx="84" cy="68" r="5" fill="#221"/>
  <circle cx="116" cy="68" r="5" fill="#221"/>
  <circle cx="85.5" cy="66.5" r="1.5" fill="#fff"/>
  <circle cx="117.5" cy="66.5" r="1.5" fill="#fff"/>
  <!-- smile sleepy -->
  <path d="M90 90 Q100 96 110 90" fill="none" stroke="#8a4b12" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="100" cy="86" rx="6" ry="4" fill="#d07a6a"/>
  <!-- headphones -->
  <path d="M62 70 Q100 22 138 70" fill="none" stroke="#222" stroke-width="6"/>
  <rect x="50" y="64" width="16" height="22" rx="5" fill="#222"/>
  <rect x="134" y="64" width="16" height="22" rx="5" fill="#222"/>
  <rect x="53" y="68" width="10" height="14" rx="2" fill="#555"/>
  <rect x="137" y="68" width="10" height="14" rx="2" fill="#555"/>
</svg>
